<style>

<body>
<header id=hdr><h1>🐱 猫猫 TProxy Plus</h1><div id=st class=pill role=status><i aria-hidden=true></i><span id=st-t>连接中…</span></div></header>

</section>
<div id=app hidden>
<div class=top><nav id=tabs role=tablist aria-label="面板分区">

</div>

<div class=tile><span class=lbl>上传速率</span><b id=o-up>—</b><small id=o-ut>累计 —</small></div>

<div class=tile><span class=lbl>活动连接</span><b id=o-cn>—</b><small>定时刷新</small></div>
</div>
<div class=card>
<div class=row><h2>最近 60 秒</h2><span class="small muted"><i class=sw></i>下载<i class="sw up"></i>上传</span></div>
<svg id=spark viewBox="0 0 300 64" preserveAspectRatio=none aria-hidden=true><line x1=0 y1=62.5 x2=300 y2="62.5"/><polyline id="sp-dn"/><polyline id="sp-up"/></svg>

</div>
</section>
<section id=p-px>
<div class=bar><label class=grow><span class=sr>过滤节点</span><input id=px-q type=search placeholder="过滤节点 / 策略组名称…" autocomplete=off></label><button id=px-r>刷新</button></div>
<div id=px-list></div>
</section>
<section id=p-cn>
<div class=bar><label class=grow><span class=sr>搜索连接</span><input id=cn-q type=search placeholder="搜索主机 / 规则 / 节点…" autocomplete=off></label>
<label><span class=sr>排序方式</span><select id=cn-sort><option value=recent>最新</option><option value=traffic>流量</option><option value=speed>速度</option></select></label>

<p id=cn-sum class="small muted"></p>
<div id=cn-list class=list></div>
</section>
<section id=p-rl>
<div id=rp class=card hidden><h2>规则集合</h2><div id=rp-list class=list></div></div>
<div class=bar><label class=grow><span class=sr>搜索规则</span><input id=rl-q type=search placeholder="搜索类型 / 内容 / 目标策略…" autocomplete=off></label><button id=rl-r>刷新</button></div>

<section id=p-pv>

<div id=pv-list></div>
</section>
</main>
</div>
<footer>局域网 DNS 由 F50 / AdGuard Home 处理</footer>
<div id=toasts role=status aria-live=polite></div>
<script>
'use strict';
(() => {
const D = document, H = D.documentElement.classList, $ = id => D.getElementById(id), enc = encodeURIComponent;
const DQ = '?url=' + enc('https://www.gstatic.com/generate_204') + '&timeout=5000';

// SECURITY: controller strings only become Text nodes or plain attribute values, never HTML

const on = (e, ev, fn) => (typeof e == 'string' ? $(e) : e).addEventListener(ev, fn), frag = () => D.createDocumentFragment();

}

const keyOf = new WeakMap(), reg = (e, k) => (keyOf.set(e, k), e); // keeps focus across re-renders

function bytes(n) {
	n = Number(n) || 0;
	let i = 0;
	while (n >= 1024 && i < 5) { n /= 1024; i++ }
	return (i ? n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) : Math.round(n)) + ' ' + ['B', 'KB', 'MB', 'GB', 'TB', 'PB'][i];
}
const rate = n => bytes(n) + '/s', pad = n => String(n).padStart(2, '0'), lc = s => String(s == null ? '' : s).toLowerCase();
const num = n => Number(n) || 0, arr = a => Array.isArray(a) ? a : [];
const ts = s => { const t = Date.parse(String(s || '').replace(/\.(\d+)/, (m, d) => '.' + (d + '00').slice(0, 3))); return t > 1e11 ? t : 0 }; // Go zero time -> 0

	return !t ? '—' : s < 5 ? '刚刚' : Math.floor(s / u[0]) + ' ' + u[1] + '前';
}
function day(t, time) {
	const d = new Date(t);
	return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + (time ? ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
}
const err = e => toast(e.message), debounce = (fn, ms = 160) => { let t = 0; return () => { clearTimeout(t); t = setTimeout(fn, ms) } };
let lastToast = '', lastToastAt = 0;
function toast(msg, kind = 'err', ms = 4500) {
	msg = String(msg);
	if (msg === lastToast && Date.now() - lastToastAt < 3000) return;
	lastToast = msg; lastToastAt = Date.now();
	const box = $('toasts'), t = el('div', 'toast ' + kind, msg);
	box.append(t);
	if (box.childElementCount > 4) box.firstElementChild.remove();
	setTimeout(() => t.remove(), ms);

const put = (id, v) => $(id).textContent = v;
function status(kind, text) { $('st').className = 'pill ' + kind; put('st-t', $('st').title = text) }

let secret = '', embed = false, parentOrigin = '', authed = false, tab = 'ov', inView = true, MODE = '';
const okSecret = v => !!v && !/[^\x20-\x7e]/.test(v); // header values must be printable ASCII
function readHash() { // "#secret=…&embed=1"; strips the secret from the URL
	const h = location.hash.slice(1), p = Object.create(null);
	if (!h) return false;
	for (const kv of h.split('&')) {
		const i = kv.indexOf('=');
		if (i > 0) try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)) } catch (e) {}
	}

	if (!okSecret(p.secret)) return false;
	store('mm-secret', secret = p.secret);
	return true;
}
const herr = (status, msg) => Object.assign(new Error(msg), {status});
function headers(json) {
	const h = {};
	if (secret) h.Authorization = 'Bearer ' + secret;
	if (json) h['Content-Type'] = 'application/json';
	return h;
}
let up = true, hpT = 0, hpWait = 1000;
const seen = () => D.visibilityState === 'visible' && inView, live = () => authed && seen();
const paint = () => { status(up ? 'ok' : 'bad', up ? '已连接' : '连接中断'); $('app').classList.toggle('down', !up) };
function online(ok) {
	if (!authed || ok === up) return;
	up = ok;
	paint();
	if (!ok) return toast('连接已中断，正在自动重连…'), watch();

	for (const s of STREAMS) s.kick();

	if (hpT || up || !live()) return;
	hpT = setTimeout(async () => {
		const t = Date.now();
		hpT = -1;
		try { await api('/version') } catch (e) {}
		hpT = 0;
		hpWait = Math.min(hpWait * 2, 10000);
		watch(Math.max(500, hpWait - Date.now() + t)); // hung controller: keep a probe pending

}
async function api(path, {method = 'GET', body, timeout = 10000} = {}) {
	const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout), used = secret;
	try {

	const card = el('article', 'card', el('div', 'row', el('h3', '', name), el('span', 'tag', p.vehicleType === 'HTTP' ? '远程订阅' : '本地文件')),
		el('p', 'small muted', arr(p.proxies).length + ' 个节点 · ' + (up ? '更新于 ' + day(up, true) + '（' + ago(up) + '）' : '尚未更新')));
	if (si && typeof si === 'object' && (si.Total || si.Upload || si.Download || si.Expire)) card.append(subInfo(si));
	card.append(el('div', 'bar end', actBtn('更新', name, path, 'PUT', '已更新', loadProviders), actBtn('健康检查', name, path + '/healthcheck', 'GET', '健康检查完成', loadProviders)));
	return card;
}
function subInfo(si) { // bytes; Expire in unix seconds
	const upl = num(si.Upload), dl = num(si.Download), used = upl + dl, total = num(si.Total), exp = num(si.Expire), box = el('div', '');
	if (total > 0) {
		const pct = Math.min(100, used / total * 100), fill = el('i', pct >= 90 ? 'hi' : pct >= 70 ? 'mid' : '');
		fill.style.width = pct.toFixed(1) + '%';
		box.append(attrs(el('div', 'meter', fill), {role: 'progressbar', 'aria-label': '流量已用', 'aria-valuenow': Math.round(pct)}));
	}
	box.append(el('div', 'small', '已用 ' + bytes(used) + (total > 0 ? ' / ' + bytes(total) + '（' + (used / total * 100).toFixed(1) + '%）' : '') + '　↑ ' + bytes(upl) + '　↓ ' + bytes(dl)));
	if (exp > 0) {
		const t = exp > 1e12 ? exp : exp * 1000, left = Math.ceil((t - Date.now()) / 864e5);
		box.append(el('div', 'small' + (left < 0 ? ' bad' : left <= 7 ? ' warn' : ''), left < 0 ? '已于 ' + day(t) + ' 过期' : '到期 ' + day(t) + '（剩余 ' + left + ' 天）'));
	} else box.append(el('div', 'small muted', '到期：长期有效'));
	return box;
}

function sync() { // live requests: visible tab of a visible page only
	const v = live();
	sTraffic.set(v && tab === 'ov');
	sMemory.set(v && tab === 'ov');
	pOverview.set(v && tab === 'ov');
	pConns.set(v && tab === 'cn' && !cnPaused);
	sLogs.set(v && tab === 'lg');
	if (v) watch(500); else if (hpT > 0) clearTimeout(hpT), hpT = 0;
}
function enter(t) {
	const f = {ov: loadConfig, px: loadProxies, rl: loadRules, pv: loadProviders}[t];
	if (f) f().catch(err);
}
function show(t) {
	tab = TABS.includes(t) ? t : 'ov';
	store('mm-tab', tab);
	for (const x of TABS) {
		attrs($('t-' + x), {'aria-selected': x === tab, tabindex: x === tab ? 0 : -1});
		$('p-' + x).hidden = x !== tab;
	}
	if (tab !== 'cn') disarm();
	if (tab === 'lg') lgStat();
	enter(tab);
	sync();
}
function gate(msg, form) {
	H.add('gated'); // embed: no dot over the card
	$('app').hidden = true;
	$('gate').hidden = false;
	put('gate-msg', msg);
	$('lf').hidden = !form;
	$('retry').hidden = form;
	if (form) $('lf-s').focus();
}
function authFailed(used) {
	if (used !== secret) return; // stale, or the login form is up
	const had = !!secret;
	authed = false;
	secret = '';
	store('mm-secret', null);
	clearTimeout(bootT); bootDue = false;
	sync();
	if (had) toast('HTTP 401 密钥错误');
	gate(had ? '密钥错误或已失效，请重新输入控制器密钥。' : '请输入控制器密钥。', true);
	status('warn', '需要密钥');
}
let bootT = 0, bootWait = 2000, bootDue = false;
async function boot() {
	clearTimeout(bootT); bootDue = false;
	authed = false;
	sync();
	status('', '连接中…');
	let v;
	try { v = await api('/version') } catch (e) {
		if (e.status === 401) return; // authFailed() shows the form
		gate(e.message + '，' + bootWait / 1000 + ' 秒后自动重试…', false);
		status('bad', '无法连接');
		bootT = setTimeout(() => seen() ? boot() : bootDue = true, bootWait);
		bootWait = Math.min(bootWait * 2, 32000);
		return;
	}
	bootWait = 2000;
	if (secret) store('mm-secret', secret);
	put('ver', String((v && v.version) || '?') + (v && v.meta ? ' (Meta)' : ''));
	authed = up = true;
	paint();
	H.remove('gated');
	$('gate').hidden = true;
	$('app').hidden = false;
	show(store('mm-tab'));
}
function toggler(id, fn) {
	const b = $(id);
	on(b, 'click', () => {
		const p = b.getAttribute('aria-pressed') !== 'true';
		attrs(b, {'aria-pressed': p}).textContent = p ? '继续' : '暂停';
		fn(p);
	});
}

for (const x of TABS) {
	attrs($('t-' + x), {role: 'tab', 'aria-controls': 'p-' + x});
	attrs($('p-' + x), {role: 'tabpanel', 'aria-labelledby': 't-' + x});
	on('t-' + x, 'click', () => show(x));
}
on('tabs', 'keydown', e => {
	const i = TABS.indexOf(tab), k = e.key, j = k === 'ArrowRight' ? i + 1 : k === 'ArrowLeft' ? i - 1 : k === 'Home' ? 0 : k === 'End' ? -1 : null;
	if (j === null) return;
	e.preventDefault();
	show(TABS[(j + TABS.length) % TABS.length]);
	$('t-' + tab).focus();
});
for (const b of $('mode').children) on(b, 'click', () => setMode(b.dataset.mode, b));
on('px-q', 'input', debounce(renderGroups));
on('px-r', 'click', () => loadProxies().then(() => toast('节点已刷新', 'ok', 1500)).catch(err));
on('cn-q', 'input', debounce(renderConns));
on('cn-sort', 'change', renderConns);
toggler('cn-p', p => { cnPaused = p; renderConns(); sync() });
on('cn-all', 'click', closeAll);
on('rl-q', 'input', debounce(renderRules, 200));
on('rl-r', 'click', () => loadRules().catch(err));
on('pv-r', 'click', () => loadProviders().catch(err));
$('lg-lv').value = lgLevel;
on('lg-lv', 'change', () => {
	store('mm-lv', lgLevel = $('lg-lv').value);
	sLogs.restart();
	lgStat();
});
toggler('lg-p', p => { lgPaused = p; if (!p) flushLogs(); lgStat() });
on('lg-c', 'click', () => { $('lg-box').replaceChildren(); lgQ = []; lgStat() });
on('lf', 'submit', e => {
	e.preventDefault();
	const v = $('lf-s').value.trim();
	if (!okSecret(v)) return void put('gate-msg', '密钥只能包含英文字母、数字和半角符号。');
	secret = v;
	$('lf-s').value = '';
	boot();
});
on('retry', 'click', () => { bootWait = 2000; boot() });
const wake = () => { sync(); if (bootDue && seen()) boot() }; // paused boot retry
on(D, 'visibilitychange', () => {
	wake();
	if (live() && (tab === 'ov' || tab === 'px')) enter(tab);
});
on(window, 'hashchange', () => { if (readHash()) boot(); H.toggle('embed', embed) });
on(window, 'message', e => {
	if (!embed || parentOrigin === null || window.parent === window || e.source !== window.parent) return;
	let origin;
	try { origin = new URL(e.origin) } catch (e) { return }
	if (origin.protocol !== 'http:' || location.protocol !== 'http:') return;
	// New hosts declare their exact origin; older hosts use the same hostname on another port.
	if (parentOrigin ? e.origin !== parentOrigin : origin.hostname !== location.hostname) return;
	const data = e.data;
	if (!data || data.type !== 'mm-secret' || typeof data.secret !== 'string' || !/^[a-f0-9]{48}$/.test(data.secret)) return;
	if (authed && data.secret === secret) return;
	store('mm-secret', secret = data.secret);
	boot();
});
on(window, 'unhandledrejection', e => { if (e.reason && e.reason.message) toast(e.reason.message) });
if (window.top !== window && window.IntersectionObserver) { // iframe scrolled away: pause
	new IntersectionObserver(es => {
		const v = es[es.length - 1].isIntersecting;
		if (v !== inView) { inView = v; wake() }
	}).observe(D.body);
}

$('boot').remove();
readHash();
if (!secret && okSecret(store('mm-secret'))) secret = store('mm-secret');
H.toggle('embed', embed);
boot();
})();
</script>
</body>
